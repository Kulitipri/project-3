# =============================================================
# Cấu hình chung cho project DeepLog trên HDFS
# Mọi đường dẫn tính từ thư mục gốc project (~/project-3)
# Tuần 2: parse HDFS_v1, dựng chuỗi theo block, EDA, chia dữ liệu, baseline
# Tuần 3: DeepLog (LSTM), phát hiện top-g, chọn ngưỡng cho mọi phương pháp, phân tích lỗi
# =============================================================
seed: 42

paths:
  raw_log: data/raw/HDFS_v1/HDFS.log
  label_file: data/raw/HDFS_v1/preprocessed/anomaly_label.csv
  ref_templates: data/raw/HDFS_v1/preprocessed/HDFS.log_templates.csv   # 29 template chuẩn của Loghub
  ref_traces: data/raw/HDFS_v1/preprocessed/Event_traces.csv            # chuỗi sự kiện chuẩn theo block
  sample_log: data/raw/HDFS_2k/HDFS_2k.log                              # bộ mẫu 2.000 dòng (khảo sát tuần 1)
  sample_ref_structured: data/raw/HDFS_2k/HDFS_2k.log_structured.csv    # đáp án parse của Loghub cho bộ mẫu
  sample_drain_config: configs/drain3_basic.ini                         # Drain3 cơ bản: chỉ che BLK/IP/NUM
  drain_config: configs/drain3.ini
  block_stats: data/interim/block_stats.csv
  structured_log: data/interim/HDFS.log_structured.csv
  templates: data/interim/HDFS.log_templates.csv
  sessions: data/processed/sessions.pkl
  event_index: data/processed/event_index.json
  splits_dir: data/processed/splits
  model_dir: outputs/models
  results_dir: outputs/results
  figures_dir: outputs/figures

parse:
  log_format: "<Date> <Time> <Pid> <Level> <Component>: <Content>"
  max_lines: null            # đặt 200000 để chạy thử nhanh; null = parse toàn bộ ~11 triệu dòng

split:
  strategy: chronological    # chronological | random
  train_normal_ratio: 0.01   # tỉ lệ session normal dùng để train (bài báo DeepLog dùng ~1%)
  val_ratio: 0.1             # tỉ lệ trích từ phần train để làm validation

model:
  window_size: 10            # h trong bài báo: số sự kiện nhìn lại
  embedding_dim: 32
  hidden_size: 64            # bài báo: 64 đơn vị nhớ mỗi lớp
  num_layers: 2              # bài báo: 2 lớp LSTM

train:
  batch_size: 512
  epochs: 50
  lr: 0.001
  patience: 5                # early stopping: dừng nếu val loss không giảm sau N epoch
  device: auto               # auto | mps | cpu

detect:
  top_g: 9                   # g trong bài báo: sự kiện thật phải nằm trong top-g dự đoán

baseline:                    # bước 6: cấu hình MẶC ĐỊNH, không chỉnh theo nhãn (chỉnh ở bước 7, mục select)
  unlabeled_ratio: 0.1       # 10% session SỚM NHẤT của test, bỏ nhãn → dữ liệu fit kiểu unsupervised; chấm trên 90% còn lại
  normal_threshold_percentile: 99   # fit trên session Normal: ngưỡng chấp nhận ~1% báo nhầm trên dữ liệu fit
  contamination: 0.03        # fit trên dữ liệu không nhãn: giả định ~3% là bất thường → ngưỡng = phân vị 97
  pca_n_components: 0.95     # giữ số thành phần giải thích 95% phương sai
  iforest_n_estimators: 100

select:                      # bước 7: chọn phương án + ngưỡng của MỌI phương pháp theo cùng một cách
  tune_ratio: 0.1            # 10% session của test (có nhãn) dùng để chọn phương án; báo cáo trên 90% còn lại
  tune_mode: random          # earliest = 10% sớm nhất | random = 10% ngẫu nhiên trong test
  tune_seed: 42              # seed chọn 10% ngẫu nhiên (tune_mode random), tách khỏi seed của mô hình
  pca_features: [standard, raw, tfidf, presence, log1p]
  pca_n_components: [0.9, 0.95, 0.99]
  iforest_features: [raw, presence, log1p]
  iforest_n_estimators: [100, 300]
  fit_on: [train_normal, unlabeled_tune]   # unlabeled_tune: fit PCA/IForest trên tập tune KHÔNG dùng nhãn
  # ngưỡng của mọi phương pháp (kể cả g của DeepLog) = ngưỡng cho F1 cao nhất trên tập tune

validate:
  deeplog_train_lines: 100000          # bài báo DeepLog lấy session train từ 100k dòng log đầu
  deeplog_train_normal_sessions: 4855  # số session Normal bài báo báo cáo cho phần train đó
